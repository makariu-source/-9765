# Builds the game and publishes it to GitHub Pages (branch gh-pages) on every push.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/strike-zone-game]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      # Yandex Games archive + store materials, downloadable from the site
      - run: npm run build:yandex
      - run: cp dist-yandex.zip dist/strike-zone-yandex.zip && mkdir -p dist/store && cp store/*.png dist/store/
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
